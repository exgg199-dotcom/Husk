name: Build iOS

on:
  push:
  workflow_dispatch:

env:
  APP_NAME: Husk
  BUNDLE_IDENTIFIER: com.nxteam.husk.test
  PREBUILT_IPA_URL: https://github.com/Leviidev/Husk/releases/download/3.4/Husk.ipa
  LOG_DIRECTORY: ${{ github.workspace }}/logs

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Prepare log directory
        run: mkdir -p "$LOG_DIRECTORY"

      - name: Install tools
        run: |
          set -o pipefail
          brew install xcodegen qemu 2>&1 | tee "$LOG_DIRECTORY/install-tools.log"
          rustup target add aarch64-apple-ios 2>&1 | tee -a "$LOG_DIRECTORY/install-tools.log"

      - name: Stage prebuilt libraries and resources
        run: |
          set -euo pipefail
          {
            curl -fsSL -o prebuilt.ipa "$PREBUILT_IPA_URL"
            mkdir -p prebuilt
            unzip -q prebuilt.ipa -d prebuilt
            PREBUILT_APP="prebuilt/Payload/Husk.app"
            mkdir -p build/ios-arm64/lib build/ios-arm64/sysroot/lib guests/phase0 third_party/build/qemu-10.0.12-utm/pc-bios build/android-system build/java-runtime
            cp "$PREBUILT_APP/Frameworks/libqemu-aarch64-softmmu.dylib" build/ios-arm64/lib/
            cp "$PREBUILT_APP/Frameworks/libhuskps4.dylib" build/ios-arm64/lib/
            cp "$PREBUILT_APP/Frameworks/libANGLE-shared.dylib" build/ios-arm64/sysroot/lib/
            rm -rf build/ios-arm64/lib/MoltenVK.xcframework
            xcodebuild -create-xcframework -framework "$PREBUILT_APP/Frameworks/MoltenVK.framework" -output build/ios-arm64/lib/MoltenVK.xcframework
            cp "$PREBUILT_APP/vmlinuz-virt" "$PREBUILT_APP/initramfs-virt" guests/phase0/
            cp "$PREBUILT_APP"/pc-bios/*.rom third_party/build/qemu-10.0.12-utm/pc-bios/
            bzip2 -c "$PREBUILT_APP/edk2-aarch64-code.fd" > third_party/build/qemu-10.0.12-utm/pc-bios/edk2-aarch64-code.fd.bz2
            rsync -a "$PREBUILT_APP/android-system/" build/android-system/
            rsync -a "$PREBUILT_APP/java-runtime/" build/java-runtime/
          } 2>&1 | tee "$LOG_DIRECTORY/stage.log"

      - name: Build pairing library
        run: |
          set -o pipefail
          ./scripts/build_rppairing_ios.sh 2>&1 | tee "$LOG_DIRECTORY/pairing.log"

      - name: Generate project
        working-directory: src/app
        run: |
          set -o pipefail
          xcodegen generate 2>&1 | tee "$LOG_DIRECTORY/xcodegen.log"

      - name: Build app
        run: |
          set -o pipefail
          xcodebuild -project src/app/Husk.xcodeproj -scheme Husk -configuration Release -sdk iphoneos -derivedDataPath build/derived-data CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" HUSK_BUNDLE_IDENTIFIER="$BUNDLE_IDENTIFIER" build 2>&1 | tee "$LOG_DIRECTORY/xcodebuild.log"

      - name: Package IPA
        run: |
          set -euo pipefail
          {
            APP_PATH="build/derived-data/Build/Products/Release-iphoneos/$APP_NAME.app"
            test -d "$APP_PATH"
            plutil -replace HuskBuildCommit -string "$(git rev-parse --short HEAD)" "$APP_PATH/Info.plist"
            plutil -replace HuskBuildDate -string "$(date -u '+%Y-%m-%d %H:%M UTC')" "$APP_PATH/Info.plist"
            rm -rf package
            mkdir -p package/Payload
            cp -R "$APP_PATH" package/Payload/
            cd package
            zip -qry "../$APP_NAME.ipa" Payload
          } 2>&1 | tee "$LOG_DIRECTORY/package.log"
          ls -la "$APP_NAME.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-unsigned-ipa
          path: ${{ env.APP_NAME }}.ipa
          if-no-files-found: error
          compression-level: 0

      - name: Write error report
        if: failure()
        run: |
          {
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "Commit: $(git rev-parse --short HEAD)"
            for log in "$LOG_DIRECTORY"/*.log; do
              [ -f "$log" ] || continue
              echo
              echo "===== $(basename "$log") ====="
              grep -nE "error:|fatal error|BUILD FAILED|\*\* BUILD|No such file|not found|cannot find|undefined symbol|Undefined symbols" "$log" | head -200 || true
              echo "----- last lines -----"
              tail -n 80 "$log"
            done
          } > error.txt

      - name: Upload error report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-build-error
          path: error.txt
